[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-ed-mcp"
version = "0.2.0rc17"
description = "CourseHarbor: a local-first course library for Canvas and Ed"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CourseHarbor contributors" }]
keywords = ["canvas", "ed-discussion", "mcp", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "httpx>=0.25.0",
  "keyring>=25.0.0,<26.0.0",
  "mcp>=1.29.0,<2.0.0",
  "platformdirs>=4.0.0",
  "pydantic>=2.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tomli-w>=1.0.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
gradescope = ["gradescopeapi>=1.8.1"]
gui = ["PySide6>=6.8,<7"]
test = []

[dependency-groups]
dev = [
  "build>=1,<2",
  "pyinstaller==6.22.3",
  "setuptools>=77",
  "wheel",
]

[project.urls]
Homepage = "https://github.com/LHYubiquitous/Canvas-Ed-CourseHarbor"
Issues = "https://github.com/LHYubiquitous/Canvas-Ed-CourseHarbor/issues"
Upstream = "https://github.com/r1ckyIn/canvas-ed-mcp"

[project.scripts]
canvas-ed-mcp = "canvas_ed_mcp.cli:main"
canvas-ed-app = "canvas_ed_mcp.ui.app_shell:main"
canvas-ed-setup = "canvas_ed_mcp.ui.first_run_window:main"
canvas-ed-configure = "canvas_ed_mcp.cli:configure_gui_main"
course-sync = "canvas_ed_mcp.cli:course_sync_main"

[project.gui-scripts]
courseharbor = "canvas_ed_mcp.ui.app_shell:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"canvas_ed_mcp.ui" = ["assets/*.png"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
