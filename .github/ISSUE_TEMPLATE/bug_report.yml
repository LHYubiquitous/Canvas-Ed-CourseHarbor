name: Bug report
description: Report a reproducible problem using synthetic, redacted evidence only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, course/account IDs, signed URLs, configs, logs, screenshots, or course material. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Synthetic reproduction and observed behavior
      description: Replace all private values with obvious synthetic canaries.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials, identifiers, signed URLs, course content, and personal paths.
          required: true
